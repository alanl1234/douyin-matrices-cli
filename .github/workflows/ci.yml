name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest click rich httpx playwright PyYAML fastapi uvicorn jinja2 python-multipart browser-cookie3
      - name: Import smoke check
        env:
          PYTHONPATH: src
        run: python -c "import dy_cli, dy_cli.dashboard.app, dy_cli.dashboard.orchestrator; print('imports ok')"
      - name: Test
        env:
          PYTHONPATH: src
        run: pytest tests/ -v -p no:cacheprovider
